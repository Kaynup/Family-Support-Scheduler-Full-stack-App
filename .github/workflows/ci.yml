name: CI - Lint, Test & Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret & Credential Safety Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify No Tracked Secrets
        run: |
          echo "Scanning repository for accidentally tracked .env or secret files..."
          FOUND_SECRETS=0
          
          # Check for tracked env files
          if git ls-files | grep -E "(^\.env|\.env\.local|\.env\.production|\.pem$|\.key$)"; then
            echo "::error::Sensitive files are tracked by git!"
            FOUND_SECRETS=1
          fi

          # Search for common high-entropy or raw private keys
          if git grep -I -E "BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY" -- ':!tests'; then
            echo "::error::Private keys detected in source code!"
            FOUND_SECRETS=1
          fi

          if [ $FOUND_SECRETS -eq 1 ]; then
            echo "Security audit failed. Remove tracked secrets before merging."
            exit 1
          fi
          echo "✓ No tracked secrets or private keys detected."

  lint-and-format:
    name: Ruff Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ruff
        run: pip install ruff==0.16.6

      - name: Run Ruff Lint
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

  test:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    needs: [secret-scan, lint-and-format]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        env:
          PYTHONPATH: backend
          JWT_SECRET_KEY: "ci-testing-dummy-secret-key-32-chars-long"
          DB_HOST: "localhost"
          DB_PORT: "3306"
          DB_USER: "root"
          DB_PASSWORD: ""
          DB_NAME: "test_db"
          DB_TABLE: "bills"
          DB_SSL: "false"
        run: pytest tests/ -v --durations=10
