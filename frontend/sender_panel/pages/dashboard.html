<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Sender Panel</title>
  <link rel="stylesheet" href="../../shared/css/styles.css" />
</head>

<body class="app-body">
  <main class="dashboard-page sender-dashboard-page">
    <h1>Sender Dashboard</h1>
    <div class="controls">
      <a href="dashboard.html" class="is-active-nav">Dashboard</a>
      <a href="bills.html">All Bills</a>
      <a href="history.html">History</a>
      <button id="refresh-btn" class="btn-refresh">Refresh</button>
      <button id="logout-btn" onclick="localStorage.removeItem('token'); localStorage.removeItem('role'); localStorage.removeItem('username'); window.location.href='/login/login.html';" class="btn-logout">Logout</button>
      <span id="user-info" class="user-info"></span>
    </div>
    <div id="status"></div>
    <div class="dashboard-grid">
      <div class="left-column">
        <aside class="left-panel">
          <section class="section-card calendar-panel">
          <div class="calendar-header">
            <h2>Calendar</h2>
            <div class="calendar-controls">
              <button id="prev-month">&lt;</button>
              <span id="calendar-month-year"></span>
              <button id="next-month">&gt;</button>
            </div>
          </div>
          <div id="calendar-grid" class="calendar-grid"></div>
          <div class="calendar-legend">
            <div class="legend-item"><span class="legend-dot dot-today"></span><span>Today</span></div>
            <div class="legend-item"><span class="legend-dot dot-due"></span><span>Unpaid</span></div>
            <div class="legend-item"><span class="legend-dot dot-paid"></span><span>Paid</span></div>
            <div class="legend-item"><span class="legend-dot dot-both"></span><span>Both</span></div>
            <div class="legend-item"><span class="legend-dot dot-expired"></span><span>Expired</span></div>
          </div>
        </section>
        </aside>

        <aside class="action-panel">
        <p id="selected-text">Select a bill to see actions.</p>
        <div class="actions">
          <button id="pay-bill" disabled class="btn-pay">Pay via Remittance</button>
        </div>
        </aside>
      </div>

      <section class="section-card right-panel-bills">
        <h2>All Beneficiary Bills</h2>
        <div id="beneficiary-filter" class="filter-row"></div>
        <div id="bills"></div>
      </section>
    </div>

    <!-- Pay Modal -->
    <div id="pay-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Confirm Payment</h2>
        <p id="pay-confirm-text">Are you sure you want to pay this bill?</p>
        <div class="modal-actions">
          <button id="cancel-pay">Cancel</button>
          <button id="confirm-pay" class="primary-btn">Pay Now</button>
        </div>
      </div>
    </div>
    <div id="upcoming-modal" class="modal hidden">
      <div class="modal-content upcoming-content">
        <p>All Due Bills: </p>
        <div class="upcoming-table-container">
          <table class="bill-table upcoming-table">
            <thead><tr><th>Bills</th><th>Due on</th><th>Amount</th><th>Status</th><th>Recurring</th></tr></thead>
            <tbody id="upcoming-bills-list"></tbody>
          </table>
        </div>
        <div class="modal-actions"><button id="upcoming-button">OK</button></div>
      </div>
    </div>
  </main>

  <script type="module" src="../js/dashboard.js"></script>
</body>

</html>
