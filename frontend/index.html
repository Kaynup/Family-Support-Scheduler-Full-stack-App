<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page | Internship Project</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="login-page">
    <section class="login-card">
      <h1>Log In</h1>
      <form action="dashboard.html" method="get" class="login-form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" placeholder="admin" required
          pattern="admin" title="Use username: admin" /><br>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="pass" required
          pattern="pass" title="Use password: pass" /><br><br><br>

        <button type="submit">Submit</button>
      </form>

    </section>
  </main>
</body>

</html>
