<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Family Support Scheduler</title>
  <meta name="description" content="Create a new account on the Family Support Scheduler as a sender or beneficiary." />
  <link rel="stylesheet" href="../shared/css/styles.css" />
</head>

<body class="auth-body">
  <main class="login-page">
    <h1>Family Support Scheduler</h1>
    <div class="section-card form-card-sm">
      <h2 class="form-title">Create Account</h2>
      <div id="error-message" class="message-error-md"></div>
      <form id="register-form">
        <div class="form-field">
          <label for="username" class="form-label">Username</label>
          <span id="username-error" class="message-error-sm"></span>
          <input id="username" name="username" type="text" required placeholder="Choose a username"
            class="form-input" />
        </div>
        <div class="form-field">
          <label for="password" class="form-label">Password</label>
          <span id="password-error" class="message-error-sm"></span>
          <input id="password" name="password" type="password" required placeholder="Choose a password"
            class="form-input" />
        </div>
        <div class="form-field-lg">
          <label for="role" class="form-label">Role</label>
          <select id="role" name="role" class="form-select">
            <option value="beneficiary">Beneficiary (creates bills)</option>
            <option value="sender">Sender (pays bills)</option>
          </select>
        </div>
        <div class="actions form-actions-column">
          <button type="submit" class="primary-btn form-submit-full">Create Account</button>
          <p class="form-meta">
            Already have an account? <a href="login.html">Sign in here</a>
          </p>
        </div>
      </form>
    </div>
  </main>

  <script type="module">
    import { handleRegisterSubmit } from './js/auth.js';
    document.getElementById('register-form').addEventListener('submit', handleRegisterSubmit);
  </script>
</body>

</html>
