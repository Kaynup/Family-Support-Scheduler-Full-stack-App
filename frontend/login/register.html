<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Family Support Scheduler</title>
  <meta name="description" content="Create a new account on the Family Support Scheduler as a sender or beneficiary." />
  <link rel="stylesheet" href="../shared/css/styles.css" />
</head>

<body>
  <main class="dashboard-page">
    <h1>Family Support Scheduler</h1>
    <div class="section-card" style="max-width: 420px; width: 100%; margin: 0 auto;">
      <h2 style="margin-top: 0;">Create Account</h2>
      <div id="error-message" style="display:none; color:#dc2626; margin-bottom:1rem; font-size:0.9rem;"></div>
      <form id="register-form">
        <div style="margin-bottom: 12px;">
          <label for="username" style="display:block; margin-bottom:5px;">Username</label>
          <input id="username" name="username" type="text" required placeholder="Choose a username"
            style="width: 100%; box-sizing: border-box;" />
        </div>
        <div style="margin-bottom: 12px;">
          <label for="password" style="display:block; margin-bottom:5px;">Password</label>
          <input id="password" name="password" type="password" required placeholder="Choose a password"
            style="width: 100%; box-sizing: border-box;" />
        </div>
        <div style="margin-bottom: 20px;">
          <label for="role" style="display:block; margin-bottom:5px;">Role</label>
          <select id="role" name="role" style="width: 100%; box-sizing: border-box;">
            <option value="beneficiary">Beneficiary (creates bills)</option>
            <option value="sender">Sender (pays bills)</option>
          </select>
        </div>
        <div class="actions" style="display:flex; flex-direction:column; gap:10px;">
          <button type="submit" class="primary-btn" style="width:100%;">Create Account</button>
          <p style="text-align:center; margin:0; font-size:0.9rem;">
            Already have an account? <a href="login.html">Sign in here</a>
          </p>
        </div>
      </form>
    </div>
  </main>

  <script type="module">
    import { handleRegisterSubmit } from './js/auth.js';
    document.getElementById('register-form').addEventListener('submit', handleRegisterSubmit);
  </script>
</body>

</html>
