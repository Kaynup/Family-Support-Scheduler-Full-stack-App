<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Family Support Scheduler</title>
  <meta name="description" content="Sign in to the Family Support Scheduler to manage and fulfill your family's bills." />
  <link rel="stylesheet" href="../shared/css/styles.css" />
</head>
<body class="auth-body">
  <main class="login-page">
    <h1>Family Support Scheduler</h1>
    <div class="section-card form-card-sm">
      <h2 class="form-title">Sign In</h2>
      <div id="error-message" class="message-error-md"></div>
      <form id="login-form">
        <div class="form-field">
          <label for="username" class="form-label">Username</label>
          <input id="username" name="username" type="text" required placeholder="Enter your username" class="form-input" />
        </div>
        <div class="form-field-lg">
          <label for="password" class="form-label">Password</label>
          <input id="password" name="password" type="password" required placeholder="Enter your password" class="form-input" />
        </div>
        <div class="actions form-actions-column">
          <button type="submit" class="primary-btn form-submit-full">Sign In</button>
          <p class="form-meta">
            Don't have an account? <a href="register.html">Register here</a>
          </p>
        </div>
      </form>
    </div>
  </main>

  <script type="module">
    import { handleLoginSubmit } from './js/auth.js';
    document.getElementById('login-form').addEventListener('submit', handleLoginSubmit);
  </script>
</body>
</html>
