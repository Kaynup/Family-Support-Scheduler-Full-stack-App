<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Bill - Family Support Scheduler</title>
  <link rel="stylesheet" href="../../shared/css/styles.css" />
</head>
<body class="app-body">
  <main class="dashboard-page">
    <h1>Create Bill</h1>
    <div class="controls">
      <a href="dashboard.html">Dashboard</a>
      <a href="bills.html">All Bills</a>
      <a href="create.html" class="is-active-nav">Create Bill</a>
      <a href="history.html">History</a>
      <button id="logout-btn" onclick="localStorage.removeItem('token'); localStorage.removeItem('role'); localStorage.removeItem('username'); window.location.href='/login/login.html';" class="btn-logout">Logout</button>
      <span id="user-info" class="user-info"></span>
    </div>
    <div id="status"></div>
    
    <div class="section-card form-card-md">
        <form id="create-bill-form">
          <div class="form-field">
            <label for="bill-name" class="form-label">Name</label>
            <input id="bill-name" name="name" type="text" required placeholder="Electricity Bill" class="form-input"/>
          </div>
          <div class="form-field">
            <label for="bill-amount" class="form-label">Amount (Rs.)</label>
            <input id="bill-amount" name="total_amount" type="number" min="0" step="0.01" required placeholder="Rs." class="form-input"/>
          </div>
          <div class="form-field">
            <label for="bill-due" class="form-label">Due Date</label>
            <input id="bill-due" name="due_date" type="date" required class="form-input"/>
          </div>
          <div class="form-field">
            <label for="bill-category" class="form-label">Category</label>
            <input id="bill-category" name="category" type="text" placeholder="optional" class="form-input"/>
          </div>
          <div class="form-field-lg">
            <label for="bill-recurring" class="form-label">Recurring</label>
            <select id="bill-recurring" name="recurring_interval" class="form-select">
              <option value="NONE">None</option>
              <option value="WEEKLY">Weekly</option>
              <option value="MONTHLY">Monthly</option>
            </select>
          </div>
          <div class="actions form-actions-row">
            <a href="bills.html" class="button-link-secondary">Cancel</a>
            <button type="submit" class="primary-btn">Create Bill</button>
          </div>
        </form>
    </div>
  </main>

  <!-- Success Modal -->
  <div id="success-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Bill Created Successfully!</h2>
      <p id="success-message">Your bill has been created and added to your bills list.</p>
      <div class="modal-actions">
        <button id="success-ok-btn" class="primary-btn">OK</button>
      </div>
    </div>
  </div>

  <script type="module" src="../js/create.js"></script>
</body>
</html>
