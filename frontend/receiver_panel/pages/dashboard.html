<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Family Support Scheduler</title>
  <link rel="stylesheet" href="../../shared/css/styles.css" />
</head>
<body>
  <main class="dashboard-page">
    <h1>Receiver Dashboard</h1>
    <div class="controls" style="display:flex; gap:10px; align-items:center;">
      <a href="dashboard.html" style="font-weight:bold;">Dashboard</a>
      <a href="bills.html">All Bills</a>
      <a href="create.html">Create Bill</a>
      <a href="history.html">History</a>
      <button id="refresh-btn" style="background-color: #3b82f6; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.875rem;">Refresh</button>
      <button id="logout-btn" onclick="localStorage.removeItem('token'); localStorage.removeItem('role'); localStorage.removeItem('username'); window.location.href='/login/login.html';" style="background-color: #ef4444; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.875rem;">Logout</button>
      <span id="user-info" style="margin-left:auto; font-weight:normal;"></span>
    </div>
    <div id="status"></div>
    <div class="dashboard-grid">
      <aside class="left-panel">
        <section class="section-card calendar-panel">
          <div class="calendar-header">
            <h2>Calendar</h2>
            <div class="calendar-controls">
              <button id="prev-month">&lt;</button>
              <span id="calendar-month-year"></span>
              <button id="next-month">&gt;</button>
            </div>
          </div>
          <div id="calendar-grid" class="calendar-grid"></div>
          <div class="calendar-legend">
            <div class="legend-item"><span class="legend-dot dot-today"></span><span>Today</span></div>
            <div class="legend-item"><span class="legend-dot dot-due"></span><span>Unpaid</span></div>
            <div class="legend-item"><span class="legend-dot dot-paid"></span><span>Paid</span></div>
            <div class="legend-item"><span class="legend-dot dot-both"></span><span>Both</span></div>
            <div class="legend-item"><span class="legend-dot dot-expired"></span><span>Expired</span></div>
          </div>
        </section>
      </aside>

      <aside class="action-panel">
        <section class="search-panel">
          <h2>Search Bills</h2>
          <div class="search-controls">
            <input type="text" id="search-input" placeholder="Name..." />
            <button id="search-btn">Search</button>
          </div>
          <div id="search-results-list"></div>
        </section>
        <p id="selected-text">Select a bill to see actions.</p>
        <div class="actions">
          <button id="delete-bill" disabled>Delete</button>
        </div>
      </aside>

      <section class="section-card">
        <h2>Due Bills</h2>
        <div id="bills"></div>
      </section>

      <section class="section-card">
        <h2>Paid Bills</h2>
        <div id="paid-bills"></div>
      </section>
    </div>

    <div id="delete-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Delete Bill</h2>
        <p id="delete-confirm-text">Are you sure you want to delete this bill?</p>
        <div class="modal-actions">
          <button id="cancel-delete">Cancel</button>
          <button id="confirm-delete">Delete</button>
        </div>
      </div>
    </div>
  </main>

  <div id="upcoming-modal" class="modal hidden">
    <div class="modal-content upcoming-content">
      <p>Bills Due within 3 days: </p>
      <div class="upcoming-table-container">
        <table class="bill-table upcoming-table">
          <thead><tr><th>Bills</th><th>Due on</th><th>Amount</th><th>Status</th><th>Recurring</th></tr></thead>
          <tbody id="upcoming-bills-list"></tbody>
        </table>
      </div>
      <div class="modal-actions"><button id="upcoming-button">OK</button></div>
    </div>
  </div>

  <script type="module" src="../js/dashboard.js"></script>
</body>
</html>
