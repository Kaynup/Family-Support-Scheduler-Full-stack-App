<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment History - Family Support Scheduler</title>
  <link rel="stylesheet" href="../../shared/css/styles.css" />
</head>
<body class="app-body">
  <main class="dashboard-page">
    <h1>Payment History</h1>
    <div class="controls">
      <a href="dashboard.html">Dashboard</a>
      <a href="bills.html">All Bills</a>
      <a href="create.html">Create Bill</a>
      <a href="history.html" class="is-active-nav">History</a>
      <button id="refresh-btn" class="btn-refresh">Refresh</button>
      <button id="logout-btn" onclick="localStorage.removeItem('token'); localStorage.removeItem('role'); localStorage.removeItem('username'); window.location.href='/login/login.html';" class="btn-logout">Logout</button>
      <span id="user-info" class="user-info"></span>
    </div>
    
    <div class="section-card spacer-top">
        <table class="bill-table">
          <thead>
            <tr>
              <th>Transaction ID</th>
              <th>From - Bill</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="history-list">
            <tr><td colspan="5" class="bill-empty-note">Loading history...</td></tr>
          </tbody>
        </table>
    </div>
  </main>
  <script type="module" src="../js/history.js"></script>
</body>
</html>
