<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment History - Family Support Scheduler</title>
  <link rel="stylesheet" href="../../shared/css/styles.css" />
</head>
<body>
  <main class="dashboard-page">
    <h1>Payment History</h1>
    <div class="controls" style="display:flex; gap:10px; align-items:center;">
      <a href="dashboard.html">Dashboard</a>
      <a href="bills.html">All Bills</a>
      <a href="create.html">Create Bill</a>
      <a href="history.html" style="font-weight:bold;">History</a>
      <button id="refresh-btn" style="background-color: #3b82f6; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.875rem;">Refresh</button>
      <button id="logout-btn" onclick="localStorage.removeItem('token'); localStorage.removeItem('role'); localStorage.removeItem('username'); window.location.href='/login/login.html';" style="background-color: #ef4444; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.875rem;">Logout</button>
      <span id="user-info" style="margin-left:auto; font-weight:normal;"></span>
    </div>
    
    <div class="section-card" style="margin-top: 20px;">
        <table class="bill-table">
          <thead>
            <tr>
              <th>Transaction ID</th>
              <th>From - Bill</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="history-list">
            <tr><td colspan="5" class="bill-empty-note">Loading history...</td></tr>
          </tbody>
        </table>
    </div>
  </main>
  <script type="module" src="../js/history.js"></script>
</body>
</html>
