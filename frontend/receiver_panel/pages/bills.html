<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Bills - Family Support Scheduler</title>
  <link rel="stylesheet" href="../../shared/css/styles.css" />
</head>
<body class="app-body">
  <main class="dashboard-page">
    <h1>All Bills</h1>
    <div class="controls">
      <a href="dashboard.html">Dashboard</a>
      <a href="bills.html" class="is-active-nav">All Bills</a>
      <a href="create.html">Create Bill</a>
      <a href="history.html">History</a>
      <button id="refresh-btn" class="btn-refresh">Refresh</button>
      <button id="logout-btn" onclick="localStorage.removeItem('token'); localStorage.removeItem('role'); localStorage.removeItem('username'); window.location.href='/login/login.html';" class="btn-logout">Logout</button>
      <span id="user-info" class="user-info"></span>
    </div>
    <div id="status"></div>
    
    <div class="content-block">
        <div class="search-panel search-panel-compact">
          <div class="search-controls">
            <input type="text" id="search-input" placeholder="Search by Name..." />
            <button id="search-btn">Search</button>
          </div>
          <div id="search-results-list"></div>
        </div>
        
        <p id="selected-text">Select a bill to see actions.</p>
        <div class="actions">
          <button id="delete-bill" disabled>Delete</button>
        </div>
    </div>

    <section class="section-card">
      <h2>Bills List</h2>
      <div id="bills"></div>
    </section>

    <div id="delete-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Delete Bill</h2>
        <p id="delete-confirm-text">Are you sure you want to delete this bill?</p>
        <div class="modal-actions">
          <button id="cancel-delete">Cancel</button>
          <button id="confirm-delete">Delete</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="../js/bills.js"></script>
</body>
</html>
