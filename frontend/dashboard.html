<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bill Management System</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="dashboard-page">
    <h1>Bill Management System</h1>
    <div class="controls">
      <a href="index.html">Logout</a>
    </div>
    <div id="status"></div>
    <div class="dashboard-grid">
      <aside class="left-panel">
        <section class="section-card calendar-panel">
          <div class="calendar-header">
            <h2>Calendar</h2>
            <div class="calendar-controls">
              <button id="prev-month">&lt;</button>
              <span id="calendar-month-year"></span>
              <button id="next-month">&gt;</button>
            </div>
          </div>
          <div id="calendar-grid" class="calendar-grid"></div>
          <div class="calendar-legend">
            <div class="legend-item">
              <span class="legend-dot dot-today"></span>
              <span>Today</span>
            </div>
            <div class="legend-item">
              <span class="legend-dot dot-due"></span>
              <span>Due</span>
            </div>
            <div class="legend-item">
              <span class="legend-dot dot-paid"></span>
              <span>Paid</span>
            </div>
            <div class="legend-item">
              <span class="legend-dot dot-both"></span>
              <span>Both</span>
            </div>
            <div class="legend-item">
              <span class="legend-dot dot-expired"></span>
              <span>Expired</span>
            </div>
          </div>
        </section>
      </aside>

      <aside class="action-panel">
        <section class="search-panel">
          <h2>Search Bills</h2>
          <div class="search-controls">
            <input type="text" id="search-input" placeholder="Name..." />
            <button id="search-btn">Search</button>
          </div>
          <div id="search-results-list"></div>
        </section>
        <p id="selected-text">Select a bill to see actions.</p>
        <div class="actions">
          <button id="mark-paid" disabled>Mark PAID</button>
          <button id="delete-bill" disabled>Delete</button>
        </div>
      </aside>

      <section class="section-card">
        <h2>Due Bills</h2>
        <div id="bills"></div>
      </section>

      <section class="section-card">
        <h2>Paid Bills</h2>
        <div id="paid-bills"></div>
      </section>
    </div>
    <div id="create-modal" class="modal hidden">
      <div class="modal-content">
        <button id="close-create-modal" class="modal-close" type="button">×</button>
        <h2>Create Bill</h2>
        <form id="create-bill-form">
          <label for="bill-name">
            Name
            <input id="bill-name" name="name" type="text" required placeholder="Electricity Bill" />
          </label>
          <label for="bill-amount">
            Amount
            <input id="bill-amount" name="total_amount" type="number" min="0" step="0.01" required placeholder="Rs." />
          </label>
          <label for="bill-due">
            Due Date
            <input id="bill-due" name="due_date" type="date" required />
          </label>
          <label for="bill-category">
            Category
            <input id="bill-category" name="category" type="text" placeholder="optional" />
          </label>
          <label for="bill-recurring">
            Recurring
            <select id="bill-recurring" name="recurring_interval">
              <option value="NONE">None</option>
              <option value="WEEKLY">Weekly</option>
              <option value="MONTHLY">Monthly</option>
            </select>
          </label>
          <div class="modal-actions">
            <button type="submit">Create</button>
          </div>
        </form>
      </div>
    </div>
    <div id="delete-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Delete Bill</h2>
        <p id="delete-confirm-text">Are you sure you want to delete this bill?</p>
        <div class="modal-actions">
          <button id="cancel-delete">Cancel</button>
          <button id="confirm-delete">Delete</button>
        </div>
      </div>
    </div>
  </main>

  <div id="upcoming-modal" class="modal hidden">
    <div class="modal-content upcoming-content">
      <p>Bills Due within 3 days: </p>
      <div class="upcoming-table-container">
        <table class="bill-table upcoming-table">
          <thead>
            <tr>
              <th>Bills</th>
              <th>Due on</th>
              <th>Amount</th>
            </tr>
          </thead>
          <tbody id="upcoming-bills-list">
          </tbody>
        </table>
      </div>
      <div class="modal-actions">
        <button id="upcoming-button">OK</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/dashboard.js"></script>
</body>

</html>
